name: Daily radar and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 7,15,23 * * *"
      timezone: Asia/Tokyo

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Collect and rank
        env:
          PYTHONIOENCODING: utf-8
        run: python -m japan_drop_radar collect

      - name: Build public files
        shell: bash
        run: |
          mkdir -p _site
          cp output/dashboard.html _site/index.html
          cp output/items.csv _site/items.csv
          python -m japan_drop_radar audit > _site/audit.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for monthly heartbeat
        if: github.event_name == 'schedule'
        uses: actions/checkout@v6

      - name: Keep the public schedule active
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then
            exit 0
          fi
          TZ=Asia/Tokyo date --iso-8601=seconds > .github/radar-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/radar-heartbeat
          git commit -m "chore: keep daily radar active [skip ci]" || exit 0
          git push
